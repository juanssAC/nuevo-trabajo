plugins {
    id "com.android.application"
}

android {
    namespace "cl.foodtruck.ventas"
    compileSdk 35

    defaultConfig {
        applicationId "cl.foodtruck.ventas"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            def releaseStoreFile = System.getenv("FOODTRUCK_KEYSTORE")
            def releaseStorePassword = System.getenv("FOODTRUCK_STORE_PASSWORD")
            def releaseKeyPassword = System.getenv("FOODTRUCK_KEY_PASSWORD")
            if (releaseStoreFile && releaseStorePassword && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias "foodtruck"
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
